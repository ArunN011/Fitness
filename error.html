<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found</title>
    <link rel="stylesheet" href="error.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<main class="error-page">

    <div class="error-bg">
        <div class="error-grid"></div>
        <div class="error-glow error-glow-one"></div>
        <div class="error-glow error-glow-two"></div>
    </div>

    <div class="error-container">

        <header class="error-header">
            <a href="index.html" class="error-logo">
                <img src="Assets/blacklogo.webp" alt="Stackly">
            </a>

            <span class="error-status">
                <i class="fa-solid fa-circle"></i>
                PAGE NOT FOUND
            </span>
        </header>

        <section class="error-content">

            <div class="error-number">
                <span>4</span>
                <div class="error-zero">
                    <i class="fa-solid fa-dumbbell"></i>
                    <strong>0</strong>
                </div>
                <span>4</span>
            </div>

            <div class="error-label">ERROR / 404</div>

            <h1>
                THIS PAGE
                <strong>ISN'T READY.</strong>
            </h1>

            <p>
                The page or section you're trying to access is currently
                unavailable. You can return to the previous section or
                continue exploring the Fitness & Wellness Center.
            </p>

            <div class="error-actions">
                <button type="button" class="error-back" id="goBack">
                    <i class="fa-solid fa-arrow-left"></i>
                    GO BACK
                </button>

                <a href="index.html" class="error-home">
                    BACK TO HOME
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>

        </section>

        <footer class="error-footer">
            <span>FITNESS</span>
            <span>WELLNESS</span>
            <span>STRENGTH</span>
            <span>CONSISTENCY</span>
        </footer>

    </div>

</main>

<script src="error.js"></script>
</body>
</html>
